<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen p-4">
<div class="bg-white/10 p-8 rounded-xl w-full max-w-sm text-center">
  <h2 class="text-xl mb-4">Forgot Password</h2>
  <p class="text-sm text-gray-300 mb-4">Enter your registered email address or username.</p>

  <input id="email" type="text" autocomplete="username"
    class="w-full p-2 rounded bg-gray-700 text-white mb-3"
    placeholder="Registered email or username">

  <button onclick="sendOTP()" class="w-full bg-purple-500 py-2 rounded mb-4">
    Send Recovery Code
  </button>



  <input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"
    class="w-full p-2 rounded bg-gray-700 text-white mb-3"
    placeholder="Enter 6-digit OTP">

  <button onclick="verifyOTP()" class="w-full bg-green-500 py-2 rounded">
    Verify OTP
  </button>
  <p id="recoveryStatus" role="status" class="text-sm mt-4 text-yellow-200"></p>
</div>
<script src="js/forgot.js"></script>
</body>
</html>
